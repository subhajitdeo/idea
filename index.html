<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvama GEX Engine</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0b0e13;
        color: #e6e6e6;
        padding: 20px;
    }
    h1 {
        color: #67CF44;
        font-size: 18px;
        margin: 0 0 8px;
        font-weight: 700;
    }
    #status {
        color: #9aa4b2;
        font-size: 12px;
        margin-bottom: 16px;
    }
    #info {
        font-size: 13px;
        margin-bottom: 12px;
        color: #c8c8d0;
        padding: 8px 12px;
        background: #0e1117;
        border: 1px solid #2a2f3a;
        border-radius: 6px;
    }
    #info b { color: #fff; }

    #gex-bar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 16px;
    }
    .gex-card {
        padding: 12px;
        background: #0e1117;
        border: 1px solid #2a2f3a;
        border-radius: 8px;
    }
    .gex-label {
        font-size: 10px;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }
    .gex-value {
        font-size: 18px;
        font-weight: 800;
        color: #fff;
    }
    .gex-sub {
        font-size: 10px;
        color: #9aa4b2;
        margin-top: 4px;
    }
    .gex-positive { color: #4ade80; }
    .gex-negative { color: #f87171; }
    .gex-neutral  { color: #fbbf24; }

    #table-container { overflow: auto; max-height: 70vh; }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
    }
    th, td {
        padding: 6px 10px;
        border: 1px solid #1c212b;
        text-align: right;
        white-space: nowrap;
    }
    th {
        background: #161b22;
        color: #9aa4b2;
        font-weight: 600;
        font-size: 11px;
        position: sticky;
        top: 0;
        z-index: 1;
    }
    .strike {
        font-weight: 700;
        text-align: center;
        background: #131820;
        color: #fff;
        font-size: 13px;
    }
    .tv { color: #c8c8d0; }
    .gex-pos { color: #4ade80; font-weight: 700; }
    .gex-neg { color: #f87171; font-weight: 700; }

    .cell-max-ce-oi { background: #5a1d1d; color: #fff; }
    .cell-max-pe-oi { background: #14522e; color: #fff; }
    .cell-max-vol   { background: #10424a; color: #fff; }
    .cell-yellow    { background: #4d4a00; color: #fff; }

    .atm-marker {
        display: inline-block;
        background: #005eff;
        color: #fff;
        font-size: 9px;
        font-weight: 800;
        padding: 1px 5px;
        border-radius: 3px;
        margin-left: 6px;
        vertical-align: middle;
    }
    .flip-marker {
        display: inline-block;
        background: #fbbf24;
        color: #0b0e13;
        font-size: 9px;
        font-weight: 800;
        padding: 1px 5px;
        border-radius: 3px;
        margin-left: 6px;
        vertical-align: middle;
    }
    .wall-marker {
        display: inline-block;
        background: #a855f7;
        color: #fff;
        font-size: 9px;
        font-weight: 800;
        padding: 1px 5px;
        border-radius: 3px;
        margin-left: 6px;
        vertical-align: middle;
    }
</style>
</head>
<body>

<h1>📊 NUVAMA · GAMMA EXPOSURE (GEX) ENGINE</h1>
<div id="status">Loading Python environment…</div>
<div id="info">Waiting for live data from Nuvama tab…</div>

<div id="gex-bar">
    <div class="gex-card">
        <div class="gex-label">Net GEX</div>
        <div class="gex-value" id="gex-net">—</div>
        <div class="gex-sub" id="gex-net-sub">—</div>
    </div>
    <div class="gex-card">
        <div class="gex-label">Gamma Flip</div>
        <div class="gex-value" id="gex-flip">—</div>
        <div class="gex-sub" id="gex-flip-sub">—</div>
    </div>
    <div class="gex-card">
        <div class="gex-label">Call Wall</div>
        <div class="gex-value" id="gex-cwall">—</div>
        <div class="gex-sub" id="gex-cwall-sub">—</div>
    </div>
    <div class="gex-card">
        <div class="gex-label">Put Wall</div>
        <div class="gex-value" id="gex-pwall">—</div>
        <div class="gex-sub" id="gex-pwall-sub">—</div>
    </div>
</div>

<div id="table-container"></div>

<script>
// ============================================================
// PYODIDE BOOT
// ============================================================
let pyodide = null;
let pyReady = false;

async function bootPython() {
    try {
        pyodide = await loadPyodide();
        await pyodide.loadPackage(["numpy", "scipy"]);
        await pyodide.runPythonAsync(PYTHON_ENGINE);
        pyReady = true;
        document.getElementById("status").innerText = "✅ Python GEX engine live — waiting for data";
    } catch (err) {
        document.getElementById("status").innerText = "❌ Python failed: " + err.message;
        console.error(err);
    }
}

// ============================================================
// PYTHON ENGINE — GEX COMPUTATION
// ============================================================
const PYTHON_ENGINE = `
import numpy as np
from scipy.stats import norm

def compute_gamma(S, K, T, r, sigma):
    """Black-Scholes Gamma for a European option."""
    if S <= 0 or K <= 0 or T <= 0 or sigma <= 0:
        return 0.0
    d1 = (np.log(S / K) + (r + 0.5 * sigma ** 2) * T) / (sigma * np.sqrt(T))
    pdf_d1 = norm.pdf(d1)
    return pdf_d1 / (S * sigma * np.sqrt(T))

def compute_gex(spot, atm_strike, days_to_expiry, rows, rate_pct):
    """
    Compute Gamma Exposure (GEX) per strike and aggregate levels.

    GEX(strike) = [Gamma_CE × OI_CE − Gamma_PE × OI_PE] × Spot² × 0.01

    Assumption: dealers are LONG calls, SHORT puts (standard convention).
    OI in lakhs (from Nuvama) is converted to absolute contracts by ×100,000.
    """
    T = max(1e-5, int(round(days_to_expiry)) / 365.0)
    r = rate_pct / 100.0

    # Per-strike GEX
    per_strike = []
    for row in rows:
        strike = row["strike"]
        ce_iv = (row.get("ceIV") or 0) / 100.0
        pe_iv = (row.get("peIV") or 0) / 100.0

        # Use Nuvama's Gamma if present, else compute
        ce_gamma = row.get("ceGamma") or 0
        pe_gamma = row.get("peGamma") or 0

        # Fallback: compute gamma from BS if Nuvama's is missing
        if ce_gamma == 0 and ce_iv > 0:
            ce_gamma = compute_gamma(spot, strike, T, r, ce_iv)
        if pe_gamma == 0 and pe_iv > 0:
            pe_gamma = compute_gamma(spot, strike, T, r, pe_iv)

        # OI in lakhs → absolute contracts
        ce_oi = (row.get("ceOI") or 0) * 100000
        pe_oi = (row.get("peOI") or 0) * 100000

        # Call GEX and Put GEX separately (for wall detection)
        call_gex = ce_gamma * ce_oi
        put_gex  = -pe_gamma * pe_oi   # negative because dealers short puts

        net_gex = call_gex + put_gex

        per_strike.append({
            "strike": strike,
            "callGEX": call_gex,
            "putGEX": put_gex,
            "netGEX": net_gex,
            "ceOI": row.get("ceOI", 0),
            "ceVol": row.get("ceVol", 0),
            "ceIV": row.get("ceIV", 0),
            "ceGamma": ce_gamma,
            "ceLTP": row.get("ceLTP", 0),
            "peOI": row.get("peOI", 0),
            "peVol": row.get("peVol", 0),
            "peIV": row.get("peIV", 0),
            "peGamma": pe_gamma,
            "peLTP": row.get("peLTP", 0)
        })

    # Scale factor: Spot² × 0.01 (represents move of 1% in underlying)
    scale = spot * spot * 0.01

    for row in per_strike:
        row["callGEX"] *= scale
        row["putGEX"]  *= scale
        row["netGEX"]  *= scale

    # Total Net GEX (sum across all strikes)
    net_gex_total = sum(r["netGEX"] for r in per_strike)

    # Call Wall = strike with highest positive Call GEX
    call_wall_row = max(per_strike, key=lambda r: r["callGEX"]) if per_strike else None

    # Put Wall = strike with highest absolute Put GEX (deepest negative)
    put_wall_row = min(per_strike, key=lambda r: r["putGEX"]) if per_strike else None

    # Gamma Flip = spot where cumulative Net GEX crosses zero
    # Sort by strike, walk up the ladder, find zero crossing
    sorted_rows = sorted(per_strike, key=lambda r: r["strike"])
    gamma_flip = None
    cum = 0
    for i in range(len(sorted_rows) - 1):
        cum += sorted_rows[i]["netGEX"]
        next_cum = cum + sorted_rows[i+1]["netGEX"]
        if cum == 0:
            gamma_flip = sorted_rows[i]["strike"]
            break
        if (cum < 0 and next_cum >= 0) or (cum > 0 and next_cum <= 0):
            # Linear interpolation
            x0 = sorted_rows[i]["strike"]
            x1 = sorted_rows[i+1]["strike"]
            y0 = cum
            y1 = next_cum
            gamma_flip = x0 + (x1 - x0) * (-y0) / (y1 - y0)
            break

    return {
        "netGEX": net_gex_total,
        "gammaFlip": gamma_flip,
        "callWall": call_wall_row["strike"] if call_wall_row else None,
        "callWallGEX": call_wall_row["callGEX"] if call_wall_row else 0,
        "putWall": put_wall_row["strike"] if put_wall_row else None,
        "putWallGEX": put_wall_row["putGEX"] if put_wall_row else 0,
        "perStrike": per_strike
    }
`;

// ============================================================
// LISTEN FOR DATA FROM EXTENSION
// ============================================================
window.addEventListener("message", async (event) => {
    if (event.source !== window) return;
    if (!event.data || event.data.source !== "nuvama-extension") return;

    if (event.data.type === "RELAY_READY") {
        console.log("[webapp] extension relay ready");
        return;
    }

    if (event.data.type !== "NUVAMA_DATA") return;
    if (!pyReady) return;

    const data = event.data.payload;

    try {
        pyodide.globals.set("_spot", data.spot);
        pyodide.globals.set("_atm", data.atmStrike);
        pyodide.globals.set("_days", data.daysToExpiry);
        pyodide.globals.set("_rows_json", JSON.stringify(data.rows));
        pyodide.globals.set("_rate", 6.5);

        const resultJson = pyodide.runPython(`
import json
_rows = json.loads(_rows_json)
_result = compute_gex(_spot, _atm, _days, _rows, _rate)
json.dumps(_result)
`);

        const gex = JSON.parse(resultJson);

        renderInfo(data);
        renderGexBar(gex, data.spot);
        renderTable(gex, data.spot, data.atmStrike);

        document.getElementById("status").innerText =
            "✅ Live — updated " + new Date().toLocaleTimeString();
    } catch (err) {
        document.getElementById("status").innerText = "❌ Compute error: " + err.message;
        console.error(err);
    }
});

// ============================================================
// RENDER INFO BAR
// ============================================================
function renderInfo(data) {
    const info = document.getElementById("info");
    info.innerHTML = `
        Spot: <b>${data.spot.toFixed(2)}</b> |
        ATM: <b>${data.atmStrike}</b> |
        Exp in <b>${data.daysToExpiry}d</b> |
        ${new Date().toLocaleTimeString()}
    `;
}

// ============================================================
// RENDER GEX BAR
// ============================================================
function renderGexBar(gex, spot) {
    // Net GEX
    const netEl = document.getElementById("gex-net");
    const netSubEl = document.getElementById("gex-net-sub");
    const netCr = gex.netGEX / 1e7;  // Convert to crores for readability
    netEl.textContent = (netCr >= 0 ? "+" : "") + netCr.toFixed(1) + " Cr";

    if (gex.netGEX > 0) {
        netEl.className = "gex-value gex-positive";
        netSubEl.textContent = "Stabilizing regime";
    } else if (gex.netGEX < 0) {
        netEl.className = "gex-value gex-negative";
        netSubEl.textContent = "Amplifying regime";
    } else {
        netEl.className = "gex-value gex-neutral";
        netSubEl.textContent = "Neutral";
    }

    // Gamma Flip
    const flipEl = document.getElementById("gex-flip");
    const flipSubEl = document.getElementById("gex-flip-sub");
    if (gex.gammaFlip) {
        flipEl.textContent = gex.gammaFlip.toFixed(0);
        if (spot > gex.gammaFlip) {
            flipEl.className = "gex-value gex-positive";
            flipSubEl.textContent = `Spot is ${(spot - gex.gammaFlip).toFixed(0)} above`;
        } else {
            flipEl.className = "gex-value gex-negative";
            flipSubEl.textContent = `Spot is ${(gex.gammaFlip - spot).toFixed(0)} below`;
        }
    } else {
        flipEl.textContent = "—";
        flipSubEl.textContent = "No zero crossing in window";
    }

    // Call Wall
    const cwallEl = document.getElementById("gex-cwall");
    const cwallSubEl = document.getElementById("gex-cwall-sub");
    if (gex.callWall) {
        cwallEl.textContent = gex.callWall;
        cwallEl.className = "gex-value gex-positive";
        cwallSubEl.textContent = `GEX: ${(gex.callWallGEX / 1e7).toFixed(1)} Cr`;
    }

    // Put Wall
    const pwallEl = document.getElementById("gex-pwall");
    const pwallSubEl = document.getElementById("gex-pwall-sub");
    if (gex.putWall) {
        pwallEl.textContent = gex.putWall;
        pwallEl.className = "gex-value gex-negative";
        pwallSubEl.textContent = `GEX: ${(gex.putWallGEX / 1e7).toFixed(1)} Cr`;
    }
}

// ============================================================
// RENDER TABLE
// ============================================================
function renderTable(gex, spot, atmStrike) {
    const container = document.getElementById("table-container");
    if (!container) return;

    const rows = gex.perStrike;
    const maxCE_OI  = Math.max(...rows.map(r => r.ceOI), 0);
    const maxPE_OI  = Math.max(...rows.map(r => r.peOI), 0);
    const maxCE_Vol = Math.max(...rows.map(r => r.ceVol), 0);
    const maxPE_Vol = Math.max(...rows.map(r => r.peVol), 0);
    const maxGEX = Math.max(...rows.map(r => Math.abs(r.netGEX)), 1);

    let html = `<table><thead><tr>
        <th>CE OI</th>
        <th>CE Vol</th>
        <th>CE Gamma</th>
        <th>Call GEX</th>
        <th>STRIKE</th>
        <th>Net GEX</th>
        <th>Put GEX</th>
        <th>PE Gamma</th>
        <th>PE Vol</th>
        <th>PE OI</th>
    </tr></thead><tbody>`;

    rows.forEach(r => {
        const isATM = r.strike === atmStrike;
        const isFlip = gex.gammaFlip && Math.abs(r.strike - gex.gammaFlip) <= 25;
        const isCallWall = r.strike === gex.callWall;
        const isPutWall  = r.strike === gex.putWall;

        const ceOICls = r.ceOI === maxCE_OI ? "cell-max-ce-oi"
                      : (maxCE_OI && r.ceOI / maxCE_OI >= 0.75) ? "cell-yellow" : "";
        const ceVolCls = r.ceVol === maxCE_Vol ? "cell-max-vol"
                       : (maxCE_Vol && r.ceVol / maxCE_Vol >= 0.75) ? "cell-yellow" : "";
        const peVolCls = r.peVol === maxPE_Vol ? "cell-max-vol"
                       : (maxPE_Vol && r.peVol / maxPE_Vol >= 0.75) ? "cell-yellow" : "";
        const peOICls = r.peOI === maxPE_OI ? "cell-max-pe-oi"
                      : (maxPE_OI && r.peOI / maxPE_OI >= 0.75) ? "cell-yellow" : "";

        const netGexCls = r.netGEX >= 0 ? "gex-pos" : "gex-neg";
        const netGexCr = r.netGEX / 1e7;

        let strikeHtml = r.strike.toLocaleString("en-IN");
        if (isATM) strikeHtml += '<span class="atm-marker">ATM</span>';
        if (isFlip) strikeHtml += '<span class="flip-marker">FLIP</span>';
        if (isCallWall) strikeHtml += '<span class="wall-marker">C-WALL</span>';
        if (isPutWall) strikeHtml += '<span class="wall-marker">P-WALL</span>';

        html += `<tr>`;
        html += `<td class="${ceOICls}">${r.ceOI.toFixed(2)}</td>`;
        html += `<td class="${ceVolCls}">${r.ceVol.toLocaleString("en-IN")}</td>`;
        html += `<td class="tv">${r.ceGamma.toFixed(5)}</td>`;
        html += `<td class="gex-pos">${(r.callGEX / 1e7).toFixed(1)}</td>`;
        html += `<td class="strike">${strikeHtml}</td>`;
        html += `<td class="${netGexCls}">${netGexCr >= 0 ? "+" : ""}${netGexCr.toFixed(1)}</td>`;
        html += `<td class="gex-neg">${(r.putGEX / 1e7).toFixed(1)}</td>`;
        html += `<td class="tv">${r.peGamma.toFixed(5)}</td>`;
        html += `<td class="${peVolCls}">${r.peVol.toLocaleString("en-IN")}</td>`;
        html += `<td class="${peOICls}">${r.peOI.toFixed(2)}</td>`;
        html += `</tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
}

// ============================================================
// BOOT
// ============================================================
bootPython();
</script>

</body>
</html>
